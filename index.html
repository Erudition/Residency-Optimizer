  <style>

      --green: 106 168 79;
      --purple: 182 42 217;
      --pink: 227 76 111;
    }

    body {
      background-color: #FDFDF8;
      background-image: url('https://res.cloudinary.com/dmukukwp6/image/upload/carpet_light_27d74f73b5.png');
      background-repeat: repeat;
    }


    /* Custom scrollbar for large spreadsheet */
    .spreadsheet-container::-webkit-scrollbar {
      height: 12px;
      width: 12px;
    }

    .spreadsheet-container::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    .spreadsheet-container::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 6px;
    }

    .spreadsheet-container::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .engine-busy {
      cursor: progress !important;
    }
    .engine-busy * {
      cursor: progress !important;
    }

    .lemon-slot {
      width: 100%;
      height: 2.5rem;
      padding: 0 0.25rem;
      font-family: "IBM Plex Sans Variable", "IBM Plex Sans", -apple-system, sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      border-radius: 4px;
      background-color: var(--slot-bg);
